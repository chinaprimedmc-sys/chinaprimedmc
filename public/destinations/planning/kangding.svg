<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Kangding planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Kangding</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">Valley city and higher landscapes need different decisions</text><rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">The valley base</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Name the actual room and its sleeping elevation</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check warmth, hot water, food, steps and quiet</text><rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">The scenic route</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Mugecuo, Xinduqiao and Tagong differ</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Assess high points, remaining walks and current access</text><rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">The whole journey</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Review each overnight and the complete road sequence</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A fixed night count does not guarantee acclimatization</text><text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text></svg>
