<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Tainan planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#f2eee5"/><text x="90" y="145" fill="#5b4639" font-family="Georgia,serif" font-size="64">Tainan</text><text x="90" y="205" fill="#71655b" font-family="Arial,sans-serif" font-size="28">Give central history, Anping and arrival their own time</text><rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#ddd0c3"/><text x="130" y="370" fill="#493a31" font-family="Georgia,serif" font-size="36">Central city</text><text x="590" y="365" fill="#64554b" font-family="Arial,sans-serif" font-size="27">Temple streets, history and meals at the right hour</text><text x="590" y="420" fill="#786d64" font-family="Arial,sans-serif" font-size="25">Use short walks, shade, seating and one useful route</text><rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#ddd0c3"/><text x="130" y="605" fill="#493a31" font-family="Georgia,serif" font-size="36">Anping chapter</text><text x="590" y="600" fill="#64554b" font-family="Arial,sans-serif" font-size="27">Fort, Tree House and neighborhood are distinct</text><text x="590" y="655" fill="#786d64" font-family="Arial,sans-serif" font-size="25">Plan a separate transfer and explain the historical layers</text><rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#ddd0c3"/><text x="130" y="840" fill="#493a31" font-family="Georgia,serif" font-size="36">Correct station</text><text x="590" y="835" fill="#64554b" font-family="Arial,sans-serif" font-size="27">HSR Tainan, TRA Tainan or an airport</text><text x="590" y="890" fill="#786d64" font-family="Arial,sans-serif" font-size="25">Fast rail time is not hotel-door arrival</text><text x="90" y="1110" fill="#786d64" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text></svg>
