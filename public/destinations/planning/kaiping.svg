<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Kaiping planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Kaiping</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Fewer villages, better interpretation and time to look</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Selected villages</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A diaolou and settlement story with real context</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Confirm the route, interiors and tower stairs</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
