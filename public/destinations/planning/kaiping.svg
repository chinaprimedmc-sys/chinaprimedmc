<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Liyuan or another distinct architectural subject</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check the full road pattern and meal plan</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">A worthwhile stay</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Urban, village-area or Chikan accommodation</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Choose the actual room, access and current setting</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
