<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Jingmai Mountain planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Jingmai Mountain</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">Tea forests, village life and learning with a real host</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Choose the base</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A named village or mountain-area property</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check the actual room, meals, steps and daily route</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">Choose the subject</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Permitted forest walk, village context and tasting</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Agree the host, language, season and optional buying</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Choose the gateway</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Lancang, Pu’er or another actual dated arrival</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Include the full road journey to the named property</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text></svg>
