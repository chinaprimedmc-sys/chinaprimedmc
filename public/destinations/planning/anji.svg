<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Anji stay-planning diagram</title>
<desc>Separate the hotel, landscape and local-interest decisions. Original schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#eff0e5"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Anji</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">One county, different places: build the stay around a clear priority</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="38">The hotel</text>
<text x="570" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Room, grounds, dining and time to unwind</text>
<text x="570" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check actual facilities, seasonality and inclusions</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="38">The landscape</text>
<text x="570" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">One selected bamboo or mountain route</text>
<text x="570" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Match roads, walking and conditions to the group</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="38">A local interest</text>
<text x="570" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Anji green tea or a considered village visit</text>
<text x="570" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A confirmed topic and host, not a generic promise</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
