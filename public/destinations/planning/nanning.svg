<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Nanning planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Nanning</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">City context before a separate Guangxi landscape stay</text><rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">The collection</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Choose the actual museum and current display</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Regional history and nationalities are distinct subjects</text><rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">Qingxiu selected</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Actual paths, scenic transport and remaining steps</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Allow heat, rain, rest and a workable alternative</text><rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">The wider route</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Daxin and Jingxi need full journeys and useful bases</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Domestic visits and border programs differ</text><text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text></svg>
