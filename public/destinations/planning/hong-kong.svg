<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Hong Kong planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Hong Kong</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Choose the neighborhood and the whole daily route</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Island or Kowloon</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A selected room, meals and contrasting city interests</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Compare actual hills, walking, quiet and transport</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">A real city day</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Neighborhood context or a current museum subject</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A harbor view is an introduction, not the whole visit</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">The next chapter</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Exact terminals, local services and entry eligibility</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A city car does not automatically cross boundaries</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
