<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Baoding planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Baoding</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">Separate city history from the outlying tomb day</text><rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Which subjects?</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Zhili office, garden, Mancheng or Qing Xiling</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Original sites and museum objects are different visits</text><rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">How long?</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Two nights: one full day; three: two distinct days</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Count the complete roads and actual station</text><rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Where to stay?</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A city room or an assessed outlying overnight</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Compare quiet, bathroom, meals and final access</text><text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text></svg>
