<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Lishui planning schematic</title>
<desc>Original stay-planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Lishui</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">The city is a gateway; the countryside needs its own plan</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">The city gateway</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Urban Liandu for services or a useful arrival night</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A regional name does not place you at the sights</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">One rural chapter</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Choose villages, terraces, scenery or craft</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Match the property, roads and walking to the subject</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">A second chapter</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Add only when the contrast and nights justify it</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Keep usable time; do not rush across every county</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
