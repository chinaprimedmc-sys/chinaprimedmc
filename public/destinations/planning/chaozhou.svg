<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Chaozhou planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Chaozhou</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Give the old city, the meal and the tea their own time</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Old-city route</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A bridge, temple or street subject with context</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check access, steps and the final hotel approach</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">A regional table</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A few explained Teochew dishes and seated time</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Clarify portions, preparation and dietary needs</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Tea or craft</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A specific topic and an appropriately arranged host</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A shop, a class and a private visit are different</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
