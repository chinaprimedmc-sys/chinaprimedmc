<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Qingdao planning diagram</title>
<desc>Comparison of travel choices. Schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f1eee6"/>
<text x="90" y="145" fill="#52605a" font-family="Georgia,serif" font-size="64">Qingdao</text>
<text x="90" y="205" fill="#5b625e" font-family="Arial,sans-serif" font-size="28">Choose the coast, the room and the pace</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="38">Historic city</text>
<text x="530" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Hillside streets and selected coastal walks</text>
<text x="530" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check gradients, room quietness and pickup</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="38">Modern waterfront</text>
<text x="530" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A particular hotel and time by the water</text>
<text x="530" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A sea view is one part of a complete stay</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="38">Laoshan</text>
<text x="530" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A named mountain-and-coast visitor route</text>
<text x="530" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Review the area, steps, transport and weather</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Planning diagram · Schematic, not to scale</text>
</svg>
