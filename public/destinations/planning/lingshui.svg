<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Lingshui planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Lingshui</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Choose the property, then one outing that adds value</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">The actual bay</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Clear Water Bay or Xiangshui Bay</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Compare room comfort, daily facilities and full transfers</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">An island day</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A specific activity and the complete crossing plan</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Private road transport does not mean a private ferry</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Time to enjoy</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A useful hotel day and an optional town meal</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Confirm family needs and a weather alternative</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
