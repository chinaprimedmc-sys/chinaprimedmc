<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Chengde planning diagram</title>
<desc>Separate estate routes, outlying temple visits and a wider Great Wall extension. Schematic comparison, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f1eee6"/>
<text x="90" y="145" fill="#52605a" font-family="Georgia,serif" font-size="64">Chengde</text>
<text x="90" y="205" fill="#5b625e" font-family="Arial,sans-serif" font-size="28">Choose the landscape and the level of walking</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="38">Mountain Resort</text>
<text x="530" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Palace and lakes, with hills as a separate choice</text>
<text x="530" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A historic estate, not the name of your hotel</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="38">Outlying temples</text>
<text x="530" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Choose contrasting sites by interest and stairs</text>
<text x="530" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Separate complexes with their own visitor routes</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="38">Jinshanling</text>
<text x="530" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A distinct Wall outing in the wider municipality</text>
<text x="530" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Review the road sequence, weather and walking</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Planning diagram · Schematic, not to scale</text>
</svg>
