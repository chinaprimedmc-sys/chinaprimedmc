<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Sanya planning diagram</title>
<desc>Compare the bay and actual hotel experience. Schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f1eee6"/>
<text x="90" y="145" fill="#52605a" font-family="Georgia,serif" font-size="64">Sanya</text>
<text x="90" y="205" fill="#5b625e" font-family="Arial,sans-serif" font-size="28">Choose the stay, then protect time to enjoy it</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="38">Yalong Bay</text>
<text x="530" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A selected resort-and-beach relationship</text>
<text x="530" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check the room, shore access and actual conditions</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="38">Haitang Bay</text>
<text x="530" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A particular hotel and its facilities</text>
<text x="530" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Pools, dining and family access need specific checks</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="38">City-side bays</text>
<text x="530" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Sanya Bay or Dadonghai by actual address</text>
<text x="530" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Compare services, quietness and complete transfers</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Planning diagram · Schematic, not to scale</text>
</svg>
