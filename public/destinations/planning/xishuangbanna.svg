<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Xishuangbanna planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Xishuangbanna</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Separate the city, the botanical garden and the resort experience</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Jinghong base</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">City food and a specific cultural introduction</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Choose the neighborhood and check room noise</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">Menglun chapter</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A defined botanical route and time for plants</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Allow the full journey, shade and walking</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Resort downtime</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A named room, grounds and usable facilities</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Keep enough unhurried time to enjoy the stay</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
