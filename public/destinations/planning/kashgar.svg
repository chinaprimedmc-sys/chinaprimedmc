<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Kashgar planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Kashgar</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Give the city its own time before choosing a mountain route</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">The city stay</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Selected old-city streets, food and interpretation</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Explain rebuilding, current use and public access</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">A real interest</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A confirmed craft or heritage subject</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A shop, studio and religious visit have different terms</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">A separate route</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Pamir or Tashkurgan travel, if suitable</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Review roads, access, altitude and the actual overnight</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
