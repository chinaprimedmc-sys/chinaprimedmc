<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Songyang planning schematic</title>
<desc>Original stay-planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Songyang</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Choose a base first; explore fewer villages with more time</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">County-town base</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Practical meals, services and road outings</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check the exact room and route to each village</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">Mountain-village stay</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Village outlook and earlier or later time on foot</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check steps, luggage, heating and dinner</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">A distinct local subject</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Tea, town life or a specific architectural project</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Confirm the route, current access and any host</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
