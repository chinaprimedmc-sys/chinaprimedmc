<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Hohhot planning diagram</title>
<desc>Separate city, grassland and overnight decisions. Schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f1eee6"/>
<text x="90" y="145" fill="#52605a" font-family="Georgia,serif" font-size="64">Hohhot</text>
<text x="90" y="205" fill="#5b625e" font-family="Arial,sans-serif" font-size="28">Give the city its own time; choose the landscape deliberately</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="38">City history</text>
<text x="530" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Selected temples, neighborhoods and regional food</text>
<text x="530" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A useful full day with interpretation and seated breaks</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="38">Grassland day</text>
<text x="530" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Xilamuren or Huitengxile by actual route</text>
<text x="530" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Different destinations, road journeys and conditions</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="38">Overnight stay</text>
<text x="530" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A named property with a room specification</text>
<text x="530" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check bathroom, heating, meals, noise and activities</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Planning diagram · Schematic, not to scale</text>
</svg>
