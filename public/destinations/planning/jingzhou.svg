<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Jingzhou planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Jingzhou</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">Archaeology, city defenses and a thoughtful local stay</text><rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Which subject?</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Museum, open wall route or Xiongjiazhong</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Keep Chu, Han and Three Kingdoms chapters clear</text><rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">How long?</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Two or three nights for one or two full days</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Give the city and outlying interests proper time</text><rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Where to stay?</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Old-city surroundings, Shashi or a rail brief</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Compare complete roads, meals and room comfort</text><text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not a geographic map · Not photography</text></svg>
