<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Haikou planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Haikou</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">Northern city culture before a separately chosen resort stay</text><rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">City culture</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Qilou streets and a relevant Hainan collection</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Allow shade, interpretation, a meal and rest</text><rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">A scenic contrast</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Choose an actual volcanic-landscape visitor route</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Assess road time, paths, steps and current access</text><rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">The onward route</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Wanning, Lingshui and Sanya are separate stays</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Compare complete journeys and the actual resort</text><text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIOR