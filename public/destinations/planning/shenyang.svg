<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Shenyang planning diagram</title>
<desc>Different historical subjects and visitor routes. Schematic comparison, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f1eee6"/>
<text x="90" y="145" fill="#52605a" font-family="Georgia,serif" font-size="64">Shenyang</text>
<text x="90" y="205" fill="#5b625e" font-family="Arial,sans-serif" font-size="28">An early Qing court, with time for a different second subject</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="38">Old-city palace</text>
<text x="530" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Architecture and court life before Beijing</text>
<text x="530" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A selected sequence, with meals and breaks</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="38">Zhaoling</text>
<text x="530" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">An imperial tomb in the Beiling Park setting</text>
<text x="530" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Review the approach, tomb entry and actual walking</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="38">Hunnan museum</text>
<text x="530" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A separate provincial collection-led visit</text>
<text x="530" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Choose galleries and allow the southern-city transfer</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Planning diagram · Schematic, not to scale</text>
</svg>
