<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Lancang planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Lancang</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">County culture, practical bases and a distinct mountain stay</text><rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Which chapter?</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">County town, Laodabao or Jingmai Mountain</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Choose a specific cultural purpose and actual host</text><rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">How long?</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Two nights for one focused county day</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Give the separate mountain stay its own time</text><rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Where to stay?</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A town base or a dedicated mountain property</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Compare full roads, sleep, meals and the host</text><text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text></svg>
