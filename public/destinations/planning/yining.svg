<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Neighborhoods, a meal and clear interpretation</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Yining city, Yining County and Ili are different</text>
