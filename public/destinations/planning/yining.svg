<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check room comfort, meals and a realistic alternative</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
