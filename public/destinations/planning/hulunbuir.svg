<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Hulunbuir planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Hulunbuir</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">Choose useful nights before choosing a regional circuit</text><rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">The grassland stay</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Hailar gateway and a specifically reviewed rural base</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check the room, bathroom, warmth, meals and noise</text><rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">The Ergun choice</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Select a wetland visit and a worthwhile town or village stay</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Count the complete road journey and useful local time</text><rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">A longer chapter</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Forest and Manzhouli directions need their own time</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Do not turn every overnight into another driving day</text><text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text></svg>
