<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Mangshi planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Mangshi</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">A thoughtful city stay, with fewer stops and more context</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">An architectural visit</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Choose the gold or silver site deliberately</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check separate access, steps and interpretation</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">A regional food day</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Explained dishes and a comfortable seated meal</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Clarify portions, inclusions and dietary needs</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Western Yunnan</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Tengchong as a different overnight chapter</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Allow the full road journey and useful nights</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
