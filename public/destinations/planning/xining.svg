<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Xining planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#eeeee5"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Xining</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Give the city its own time before choosing a higher route</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">City introduction</text>
<text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A selected museum, neighborhood and regional meal</text>
<text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Keep arrival modest and the room comfortable</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">Kumbum outing</text>
<text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A separate road journey and religious visitor route</text>
<text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check walking, interpretation and current access</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">The higher chapter</text>
<text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Qinghai Lake or a longer mountain journey</text>
<text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Review daytime heights and sleeping elevations</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
