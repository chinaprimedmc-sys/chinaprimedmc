<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">The right base</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">City comfort or a named rural tea-area property</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check room, meals and actual daily road journeys</text>
