<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Tianjin planning diagram</title>
<desc>Choose central Tianjin, Binhai or Jizhou for different travel purposes. Schematic comparison, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f1eee6"/>
<text x="90" y="145" fill="#52605a" font-family="Georgia,serif" font-size="64">Tianjin</text>
<text x="90" y="205" fill="#5b625e" font-family="Arial,sans-serif" font-size="28">One municipality, three different travel purposes</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="38">Central city</text>
<text x="530" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Wudadao, the Haihe and regional food</text>
<text x="530" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A focused day trip or time for a riverfront evening</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="38">Binhai</text>
<text x="530" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A named coastal venue or cruise terminal</text>
<text x="530" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Plan from the actual address and ship instructions</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="38">Jizhou</text>
<text x="530" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Countryside, mountains or Huangyaguan</text>
<text x="530" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A separate road plan and possibly a different base</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Planning diagram · Schematic, not to scale</text>
</svg>
