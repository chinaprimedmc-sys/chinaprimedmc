<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Nuodeng planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Nuodeng</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">Salt history and a hillside stay, with access planned first</text>
