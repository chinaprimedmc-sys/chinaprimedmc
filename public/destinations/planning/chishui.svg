<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Chishui planning schematic</title><desc>Original planning schematic, not a geographic map or destination photograph.</desc><rect width="1600" height="1200" fill="#eef1e8"/><text x="90" y="145" fill="#304d43" font-family="Georgia,serif" font-size="64">Chishui</text><text x="90" y="205" fill="#5f6b63" font-family="Arial,sans-serif" font-size="28">Red cliffs, waterfalls and a route with real contrast</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">One scenic priority</text><text x="590" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Great Waterfall, Sidonggou or Foguangyan</text><text x="590" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Choose actual steps, return climb and access</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">One useful contrast</text><text x="590" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Bamboo, a town or a different landscape subject</text><text x="590" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Separate public visits from hosted activities</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cbd6ca"/><text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">A suitable base</text><text x="590" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">City services or a named rural property</text><text x="590" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Include daily roads, meals and wet-weather comfort</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text></svg>
