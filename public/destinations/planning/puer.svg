<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Pu’er planning schematic</title>
<desc>Original planning schematic, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f0eee4"/>
<text x="90" y="145" fill="#405648" font-family="Georgia,serif" font-size="64">Pu’er</text>
<text x="90" y="205" fill="#5b6257" font-family="Arial,sans-serif" font-size="28">Name the place and the learning purpose before choosing a stay</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="36">Simao city base</text>
<text x="570" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Services and a confirmed city-area interest</text>
<text x="570" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">A Pu’er label does not place you at every tea forest</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="36">A hosted subject</text>
<text x="570" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">Tasting, processing, a field walk or coffee</text>
<text x="570" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Agree the host, topic, season and purchase terms</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#cfd5c6"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="36">Jingmai chapter</text>
<text x="570" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="27">A separate mountain and village stay</text>
<text x="570" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Review the gateway, room and full road journey</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Original planning schematic · Not to scale · Not photography</text>
</svg>
