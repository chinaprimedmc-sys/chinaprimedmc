<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Wuhan planning diagram</title>
<desc>Three choices for a Wuhan stay. Schematic comparison, not a geographic map or destination photograph.</desc>
<rect width="1600" height="1200" fill="#f1eee6"/>
<text x="90" y="145" fill="#52605a" font-family="Georgia,serif" font-size="64">Wuhan</text>
<text x="90" y="205" fill="#5b625e" font-family="Arial,sans-serif" font-size="28">Choose a base around the days you want</text>
<rect x="90" y="300" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="370" fill="#263b31" font-family="Georgia,serif" font-size="38">Hankou</text>
<text x="530" y="365" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Historic streets, breakfast and riverfront evenings</text>
<text x="530" y="420" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Check the block, room quietness and walking route</text>
<rect x="90" y="535" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="605" fill="#263b31" font-family="Georgia,serif" font-size="38">Wuchang</text>
<text x="530" y="600" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">Museum collections and Yellow Crane Tower</text>
<text x="530" y="655" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Separate visits, with transfers and time to understand</text>
<rect x="90" y="770" width="1420" height="180" rx="16" fill="#fffdf7" stroke="#d2d5c9"/>
<text x="130" y="840" fill="#263b31" font-family="Georgia,serif" font-size="38">East Lake</text>
<text x="530" y="835" fill="#4e5b54" font-family="Arial,sans-serif" font-size="28">A chosen lake section or a property-led stay</text>
<text x="530" y="890" fill="#626b61" font-family="Arial,sans-serif" font-size="25">Set an entrance, a manageable route and pickup</text>
<text x="90" y="1110" fill="#626b61" font-family="Arial,sans-serif" font-size="24">AVIORA · Planning diagram · Schematic, not to scale</text>
</svg>
