<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">AVIORA graphic directions</title>
  <desc id="desc">Three travel-oriented logo directions: Folded Map, Route Window, and Quiet Cartography.</desc>
  <rect width="1800" height="1080" fill="#F5F1E8"/>

