name: Site quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check:release
      - run: pnpm audit:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-quality-reports
          path: |
            playwright-report/
            test-results/
            artifacts/quality/
            artifacts/lighthouse/
            artifacts/media/
